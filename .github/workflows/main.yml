name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova App and Build APK
        run: |
          cordova create app com.dku.docseditor "DKU Docs Editor"
          rm -rf app/www/*
          cp index.html app/www/
          cd app
          cordova platform add android
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DKU-Docs-Editor-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
